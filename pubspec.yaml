name: easy_test_app
description: >-
  App-agnostic core for widget-testing Flutter apps. Ships the
  easyTestWidgets harness, an app launcher + journey model, value/matcher
  request helpers, header and error builders, the platform mock, and
  PatrolTester / PatrolFinder extensions. Each app composes it by injecting its
  own mocks (init) and journeys.
version: 0.1.3
homepage: https://github.com/Ahmed-Omar-Hommir/easy_test_app
repository: https://github.com/Ahmed-Omar-Hommir/easy_test_app
issue_tracker: https://github.com/Ahmed-Omar-Hommir/easy_test_app/issues
environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  patrol_finders: ^3.5.0
  easy_mock_http: ^0.4.0
  easy_mock_channel: ^0.1.0
  easy_mock_system_channel: ^0.1.0
  data_builder_test: ^0.11.0

dev_dependencies:
  flutter_lints: ^6.0.0
